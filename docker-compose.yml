services:
  api:
    build: .
    container_name: polymatrix_api
    restart: always
    env_file:
      - .env
    ports:
      # Bind control planes to loopback by default. Put an authenticated TLS
      # reverse proxy in front if remote operations are required.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/polymatrix
      - REDIS_URL=redis://redis:6379/0
      - PM_WS_URL=wss://ws-subscriptions-clob.polymarket.com/ws/market
      - PM_API_URL=https://clob.polymarket.com
      - PM_CHAIN_ID=137
      - PK=${PK}
      - FUNDER_ADDRESS=${FUNDER_ADDRESS}
      - TRADING_MODE=${TRADING_MODE:-disabled}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-False}
      - LIVE_ARM_TOKEN=${LIVE_ARM_TOKEN:-}
      - LIVE_ARM_EXPIRES_AT=${LIVE_ARM_EXPIRES_AT:-}
      - LIVE_ALLOWED_FUNDER_ADDRESSES=${LIVE_ALLOWED_FUNDER_ADDRESSES:-}
      - LIVE_BUDGET_CAP_USD=${LIVE_BUDGET_CAP_USD:-100.0}
      - APP_CODE_COMMIT=${APP_CODE_COMMIT:-}
      - ALPHA_STRATEGY_ID=${ALPHA_STRATEGY_ID:-maker-alpha-v2}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - ENABLE_ADMIN_WIPE=${ENABLE_ADMIN_WIPE:-False}
      - MAX_EXPOSURE_PER_MARKET=${MAX_EXPOSURE_PER_MARKET:-40.0}
      - EXPOSURE_TOLERANCE=${EXPOSURE_TOLERANCE:-0.01}
      - RECONCILIATION_BUFFER_SECONDS=${RECONCILIATION_BUFFER_SECONDS:-8.0}
      - TRADING_LOG_PATH=/app/data/logs/trading.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Shared log volume so dashboard can read trading.log
      - logs_data:/app/data/logs

  dashboard:
    build: .
    container_name: polymatrix_dashboard
    restart: always
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/polymatrix
      - API_URL=http://api:8000
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - TRADING_LOG_PATH=/app/data/logs/trading.log
    volumes:
      # Mount the same logs volume used by the API so we can read trading.log
      - logs_data:/app/data/logs
    depends_on:
      - api
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: polymatrix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: polymatrix
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymatrix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polymatrix_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
  logs_data:
